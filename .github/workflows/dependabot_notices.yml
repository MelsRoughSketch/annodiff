name: Update Dependabot notices

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  update:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/cargo/') &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
      actions: write
    steps:
      # Only run trusted default-branch code; treat the CI artifact as data.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/dependabot_notices.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
