name: Publish to crates.io

on:
  release:
    # Covers stable publication and promotion from prerelease without duplicate runs.
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      publish: ${{ steps.release.outputs.publish }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Validate release and resolve commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          release = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release.json").read_text())
          with open("Cargo.toml", "rb") as manifest:
              package = tomllib.load(manifest)["package"]
          version = package["version"]
          tag = os.environ["RELEASE_TAG"]
          if release["isDraft"] or release["isPrerelease"]:
              raise SystemExit("Only published stable releases can be published to crates.io")
          if release["tagName"] != tag or tag != f"v{version}" or package["name"] != "annodiff":
              raise SystemExit("Release tag must match the annodiff package version")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/annodiff/{version}",
              headers={"User-Agent": "annodiff release workflow"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30):
                  publish = False
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              publish = True
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"sha={sha}", file=output)
              print(f"publish={str(publish).lower()}", file=output)
          print(f"{tag} at {sha}: {'ready to publish' if publish else 'already published; skipping'}")
          PY

  ci:
    needs: prepare
    if: ${{ needs.prepare.outputs.publish == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify publish package before authentication
        run: cargo publish --dry-run --locked
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
